<div class="error-container">
    <h2>{{ message }}</h2>
  
    <!-- Show extra info depending on the message -->
    <p *ngIf="message === '404 - Page Not Found'">
      The page you are looking for does not exist.
    </p>
  
    <p *ngIf="message === '500 - Server Error'">
      An unexpected error occurred on the server. Please try again later.
    </p>
  
    <p *ngIf="message === 'Something Went Wrong'">
      Please try again later or return to the home page.
    </p>
  
    <a routerLink="/">Go back to Home</a>
  </div>
